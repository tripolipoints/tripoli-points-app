function calc(inv,pct,on,p,m,o){const tl=TIERS[(m&&m.tier)||'large'],rp2=m?rdPct(m,p)/100:0;
  const disc=o&&o.type==='discount'?+(inv*o.val/100).toFixed(2):0, base=+(inv-disc).toFixed(2);
  const vc=m&&p&&isVip(m,p)?Math.min(vipCap(m,p),Math.floor(base*RATE)):0;
  const cap=p&&S.customers[p]?(vc>0?Math.min(maxRedeem(p),vc):Math.min(maxRedeem(p),Math.floor(base*RATE*rp2),tl.maxPts)):0, rp=on?cap:0, rv=rp/RATE, net=+(base-rv).toFixed(2);
  const bonus=o&&o.type==='bonus'&&o.per>0?Math.floor(net/o.per)*o.pts:0;
  return {disc,base,redeemPts:rp,redeemVal:rv,net,bonus,gift:o&&o.type==='gift'?o.gift:'',earn:Math.floor(net*pct/100*RATE)+bonus};
}

 // سحب هدية الترحيب غير المصروفة يتم فعلياً على السيرفر (customer_check_welcome_expiry)، وليس هنا محلياً.

 if(S.mode==='customer'&&S.phone&&S.customers[S.phone]){const w=S.customers[S.phone].welcome;if(w&&w.remain>0&&Date.now()>w.exp){syncCustomerData(S.phone)}}
 return c}
async function createTx(mid,p,inv,on,items,offerId){
  const m=M(mid),c=S.customers[p];
  if(m.status!=='active')return'حساب المحل غير فعّال';
  if(!/^\d{7,8}$/.test(p))return'رقم الهاتف غير صحيح';
  if(p===m.phone)return'لا يمكن تسجيل عملية على رقم المحل نفسه';
  if(!c)return'هذا الرقم غير مسجّل في التطبيق';
  if(c.status!=='active')return'حساب الزبون مجمّد';
  if(!(inv>0))return'أدخل قيمة الفاتورة';
  if(reserved(p)>0)return'لدى الزبون عملية قيد التأكيد';
  const res=await sbRpc('create_transaction',{p_merchant_id:mid,p_customer_phone:p,p_invoice:inv,p_redeem:!!on,p_offer_id:offerId||null,p_items:items||[]});
  if(!res)return'تعذّر الاتصال بالخادم';
  if(!res.ok)return res.error||'تعذّر إنشاء العملية';
  if(S.mf.reqId){await sbRpc('merchant_close_request',{p_request_id:S.mf.reqId,p_merchant_id:mid});const r=S.custReq.find(x=>x.id===S.mf.reqId);if(r)r.used=true;S.mf.reqId=null}
  await syncMerchantData(mid);
  S.mf.txId=res.tx_id;
  return null;
}
async function decide(id,ok){
  if(S._deciding)return; // one decision request at a time: a second tap (or the same purchase shown twice) is ignored
  S._deciding=String(id);render({bg:true});
  try{return await decideRun(id,ok)}finally{S._deciding=null;render({bg:true})}}
async function decideRun(id,ok){
  const res=await sbRpc('decide_transaction',{p_tx_id:id,p_confirm:ok});
  if(!res||!res.ok){toast('انتهت مهلة العملية');await custTxRefresh(S.phone);return render()}
  const p=S.phone;
  toast(ok?'تم تأكيد العملية':'تم إلغاء العملية');
  await syncCustomerData(p);
  if(ok&&S.mode==='customer'){S.sub='success';S.doneId=id;S.tab='home'}
  render();
}
function fraud(){
  const o=[];S.tx.forEach(t=>{if(t.invoice>=FRAUD_AMT)o.push(`فاتورة كبيرة ${usd(t.invoice)} في ${M(t.mid).name}`)});
  const g={};S.tx.forEach(t=>{if(Date.now()-t.at<600000){const k=t.mid+'|'+t.phone;g[k]=(g[k]||0)+1}});
  Object.entries(g).forEach(([k,n])=>{if(n>=FRAUD_N){const[a,p]=k.split('|');o.push(`${n} عمليات خلال 10 دقائق في ${M(a).name} للرقم ${p}`)}});return o;
}

function sha256(ascii){ascii=unescape(encodeURIComponent(ascii));
  function rr(v,a){return(v>>>a)|(v<<(32-a))}var mp=Math.pow,mw=mp(2,32),L='length',i,j,res='',words=[],bl=ascii[L]*8,hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k[L],ic={};
  for(var c=2;pc<64;c++){if(!ic[c]){for(i=0;i<313;i+=c)ic[i]=c;hash[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0}}
  ascii+='\x80';while(ascii[L]%64-56)ascii+='\x00';
  for(i=0;i<ascii[L];i++){j=ascii.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}
  words[words[L]]=((bl/mw)|0);words[words[L]]=bl;
  for(j=0;j<words[L];){var w=words.slice(j,j+=16),old=hash;hash=hash.slice(0,8);
    for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4],t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0),t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
    for(i=0;i<8;i++)hash[i]=(hash[i]+old[i])|0}
  for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;res+=((b<16)?0:'')+b.toString(16)}return res}

function syncDirectory(){
  if(_dirInflight)return _dirInflight;
  if(S.dirState==='ok'&&Date.now()-_dirLoadedAt<DIR_TTL)return Promise.resolve();
  _dirInflight=(async()=>{TPP.mark('dir-start');let list=null;const pre=_dirPre;_dirPre=null;
    if(pre){await pre.p;if(pre.list&&Date.now()-pre.at<DIR_TTL){list=pre.list;TPP.mark('dir-from-prefetch')}}
    if(!list)list=await sbRpc('list_merchants',{});if(list)TPP.mark('shops-data');if(list){list.forEach(hydrateMerchant);S.dirState='ok';_dirLoadedAt=Date.now()}else if(S.dirState!=='ok')S.dirState='error';render({bg:true})})().finally(()=>{_dirInflight=null});

const AI_PROMPT_TEXT='حوّل هذه الصورة إلى صورة إعلانية احترافية لعرض خاص على تطبيق Tripoli Points:\n- افصل المنتج الأساسي عن خلفيته الأصلية، وضعه على خلفية نظيفة واحترافية تناسب عرضه كمنتج للبيع.\n- اجعل مقاس الصورة النهائية مربعاً (نسبة 1:1).\n- احذف تماماً أي نصوص موجودة في الصورة الأصلية اذا كانت مضافه على الصورة، ولا تعتمد عليها كمرجع لأي نص جديد. لا تضف اي نصوص عريضة او اي عناوين.\n- اذا وجدت اي صور او علامات تجارية على المنتج اظهرها.\n- إذا أضفت أي نص جديد، يجب أن يكون باللغة العربية الفصحى وخالياً تماماً من أي خطأ إملائي أو لغوي.\nتجنب الكلمات العربية غير المفهومة أو التي تم تهجئتها بشكل خاطئ.\nضع شعار العرض محدود.\n\nيرجى تصميم شعار (Logo) لمبادرة "Tripoli Points" على خلفية بيضاء نقية ذات زوايا منحنية بلطف (Rounded Square background). الشعار بتصميم مسطح (Flat Design) ونظيف.\n\nالعناصر البصرية والتركيب:\n1. في الأعلى (أيقونة الخريطة والمدينة):\n  - دبوس موقع جغرافي (Map Pin) باللون الأزرق الداكن (Navy Blue).\n  - داخل الدبوس، يوجد رسم مبسط بالأبيض لمعالم مدينة طرابلس، يظهر فيها بوضوح برج ساعة عتيق (مثل ساعة طرابلس أو Mansouri Great Mosque minaret) وإلى جانبه نخلة.\n  - أعلى الدبوس وإلى اليمين قليلاً، توجد ثلاث خطوط إشعاعية صفراء صغيرة (مثل رمز الفكرة أو التألق).\n  - يوجد خط بيضاوي أصفر (مثل ظل أو مدار) يدور حول قاعدة الدبوس.\n2. في المنتصف (اسم المبادرة بالإنجليزية):\n  - كلمة "Tripoli" بحط إنجليزي عريض (Bold)، ولونها أزرق داكن (طابق لون دبوس الموقع).\n  - أسفلها مباشرة، كلمة "Points" بنفس الخط العريض، ولكن بلون برتقالي-أصفر (Golden Yellow/Orange).\n  - يجب أن يكون النص الإنجليزي متمركزاً عمودياً (centered align).\n3. في الأسفل (الشعار اللفظي بالعربية):\n  - عبارة محاذاة في الأسفل: "كل نقطة .. بتدعم مدينتك"\n  - الخط العربي يجب أن يكون خطاً حديثاً، رفيعاً وواضحاً (modern sans-serif Arabic script).\n  - لون الخط العربي أزرق داكن.\n\nالألوان المحددة (Palette):\n- الأزرق الداكن: Navy Blue (#002C6A أو مشابه).\n- البرتقالي الذهبي: Golden Orange/Yellow (#F9A826 أو مشابه).\n- الأبيض: للنقوش الداخلية داخل الدبوس وللخلفية.\n\nالأسلوب العام:\nتصميم احترافي، عصري، نظيف، وثنائي الأبعاد (2D) بدون تدرجات لونية (solid colors).\n\n- بخصوص شعار تطبيق Tripoli Points، ضعه صغيراً وشفافاً (بدون أي خلفية بيضاء خلفه) في إحدى زوايا الصورة فقط دون أن يغطي المنتج. لا تعيد تكرار الشعار ولا تخترع شعاراً بديلاً بنفسك مهما كان شكله، ولا تضف أي شعار من تصميمك الخاص. استخدم مواصفات الشعار في الأعلى.';

async function addOffer(){const f=S.of,m=M(S.merchantId),T=f.type,o={mid:m.id,badge:'جديد',at:Date.now(),days:+f.days,active:true,type:T,min:+f.min||0,first:!!f.first};

  else if(T==='product'){if(!f.img)return toast('أضف صورة المنتج');o.img=f.img;o.oldPrice=+f.oldPrice;o.newPrice=+f.newPrice;o.specs=(f.specs||'').trim();if(!(o.oldPrice>0))return toast('أدخل السعر السابق');if(!(o.newPrice>0&&o.newPrice<o.oldPrice))return toast('السعر الجديد يجب أن يكون أقل من السعر السابق')}
  else{o.pts=parseInt(f.pts);o.per=+f.per;if(!(o.pts>0&&o.per>0))return toast('أدخل عدد النقاط والمبلغ')}
  o.title=offerTitle(o);
  const res=await sbRpc('merchant_add_offer',{p_merchant_id:m.id,p_type:T,p_title:o.title,p_badge:'جديد',p_val:o.val??null,p_gift_text:o.gift??null,p_pts:o.pts??null,p_per:o.per??null,p_old_price:o.oldPrice??null,p_new_price:o.newPrice??null,p_img_url:o.img??null,p_min_amount:o.min,p_days:o.days,p_first_time_only:o.first,p_specs:o.specs||null});
  if(!res)return render();

function catAdminTree(parentId,depth){
  const items=(S.cats||[]).filter(c=>(parentId===null?!c.parent_id:c.parent_id===parentId)).sort((a,b)=>a.sort_order-b.sort_order);
  if(!items.length)return depth===1?'<p class="muted" style="font-size:12px;margin:4px 0 0">لا توجد فئات فرعية</p>':'';
  return items.map(c=>{const kids=catAdminTree(c.id,depth+1);
    return `<div style="margin-bottom:${depth===0?14:6}px">${catAdminRow(c)}${kids?`<div style="padding-right:14px">${kids}</div>`:''}</div>`;
  }).join('');
}

function parseLatLng(str){str=(str||'').trim();if(!str)return null;
  let m=str.match(/!3d(-?\d{1,3}(?:\.\d+)?)!4d(-?\d{1,3}(?:\.\d+)?)/);
  if(!m)m=str.match(/[?&]q=(-?\d{1,3}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)/);
  if(!m)m=str.match(/@(-?\d{1,3}(?:\.\d+)?),(-?\d{1,3}(?:\.\d+)?)/);
  if(!m)m=str.match(/(-?\d{1,3}\.\d+)\s*[,\s]\s*(-?\d{1,3}\.\d+)/);
  if(!m)return null;
  const lat=parseFloat(m[1]),lng=parseFloat(m[2]);
  if(!(lat>=-90&&lat<=90&&lng>=-180&&lng<=180))return null;
  return{lat,lng}}

// السبب الجذري: الخريطة تمتد (88vh) تحت الشريط السفلي، والزر مثبّت على أسفل حاويتها (bottom:10px) وبطبقة z-index أعلى من الشريط، فيظهر فوقه.

function placeLocateBtn(){const m=document.getElementById('rmap');if(!m)return;const b=m.querySelector('.mchip.mround');if(!b)return;
  if(m.classList.contains('tp23-fullscreen')||!m.classList.contains('tp23-home-map')){b.dataset.lift=0;if(b.style.bottom!=='10px')b.style.bottom='10px';return}
  const mr=m.getBoundingClientRect(),vv=window.visualViewport;let lim=vv?vv.offsetTop+vv.height:window.innerHeight;
  const nav=document.querySelector('#navSlot .nav');if(nav){const nr=nav.getBoundingClientRect();if(nr.height>0&&getComputedStyle(nav).visibility!=='hidden')lim=Math.min(lim,nr.top)}
  const hidden=Math.max(0,mr.bottom-lim),maxOff=Math.max(0,mr.height-b.offsetHeight-170),lift=Math.round(Math.min(hidden,maxOff)),v=(10+lift)+'px';
  b.dataset.lift=lift;if(b.style.bottom!==v)b.style.bottom=v}

if(window.ResizeObserver)new ResizeObserver(_plbQ).observe(document.getElementById('app')); // محتوى أعلى الخريطة يغيّر ارتفاعه (صورة الواجهة، البطاقة) فيتحرّك موضع الخريطة دون تمرير

  if(!S.mv){const f=fitPts(allActiveMerchants().map(llOf),44);t.lat=f.lat;t.lng=f.lng;t.z=f.z+TRIPOLI_ZOOM_BOOST}

setInterval(()=>{if(S.screen==='app'&&(sweep()||(S.mode==='admin'&&Date.now()>S.adminUntil)))renderDeferredIfTouching()},10000);
// render() على تبويب الخريطة يستبدل كامل محتوى الصفحة ويعيد بناء الخريطة (مستمعات لمس جديدة) ويصفّر التمرير — إن حصل هذا أثناء لمس/سحب فعلي
// من المستخدم (كما يحصل فعلياً حين تصل بيانات المزامنة من الخادم بعد تحميل الصفحة بلحظات، وهي نفس اللحظة التي يبدأ المستخدم باستكشاف الصفحة بلمسه)
// فإن ذلك يُحدث قفزة/اهتزاز مفاجئ تحت إصبعه. الحل: تأجيل أي render() "خلفي" (غير ناتج عن ضغطة مباشرة من المستخدم) لحين انتهاء اللمسة الحالية.
let __touchActive=false;

(function(){
 // يكتشف اصطلاح scrollLeft في RTL للمتصفح الحالي (يختلف بين Chrome وSafari وغيرهما) حتى يعمل السحب بشكل صحيح وضمن الحدود الصالحة دائماً، بدل افتراض اصطلاح متصفح واحد.
 const RTLTYPE=(()=>{try{
   const d=document.createElement('div');
   d.dir='rtl';d.style.cssText='position:absolute;top:-9999px;left:-9999px;width:4px;height:4px;overflow:scroll;font-size:14px';
   d.innerHTML='<div style="width:100px;height:1px"></div>';
   document.body.appendChild(d);
   let type='negative';
   if(d.scrollLeft>0){type='reverse'}
   else{d.scrollLeft=1;type=(d.scrollLeft===0)?'negative':'default'}
   document.body.removeChild(d);
   return type;
 }catch(e){return'negative'}})();
 const scrollMax=el=>Math.max(0,el.scrollWidth-el.clientWidth);
 const toNorm=el=>{const m=scrollMax(el),s=el.scrollLeft;return RTLTYPE==='reverse'?m-s:RTLTYPE==='negative'?-s:s};
 const fromNorm=(el,n)=>{const m=scrollMax(el);n=Math.min(m,Math.max(0,n));return RTLTYPE==='reverse'?m-n:RTLTYPE==='negative'?-n:n};
 let el=null,sx=0,sl=0,moved=false,id=null;
 const find=t=>{while(t&&t.nodeType===1){if(t.classList&&(t.classList.contains('chips')||t.classList.contains('catPlainRow')))return t;t=t.parentElement}return null};
 document.addEventListener('pointerdown',e=>{const t=find(e.target);if(!t||t.scrollWidth<=t.clientWidth)return;el=t;sx=e.clientX;sl=toNorm(t);moved=false;id=e.pointerId},{passive:true});
 document.addEventListener('pointermove',e=>{if(!el||e.pointerId!==id)return;const dx=e.clientX-sx;if(Math.abs(dx)>4)moved=true;el.scrollLeft=fromNorm(el,sl-dx)},{passive:true});
 const end=e=>{if(el&&id!=null&&e.pointerId===id){el=null;id=null}};
 document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
 document.addEventListener('click',e=>{if(moved){moved=false;e.preventDefault();e.stopPropagation()}},true)
})();

(function(){ // أداة تشخيص مؤقتة لمشكلة "تحرّك الشاشة مع الإصبع": تُفعَّل فقط بإضافة ?debug=1 للرابط، بدون أي تأثير على السلوك العادي
  if(!/[?&]debug=1\b/.test(location.search))return;

  window.addEventListener('pointermove',e=>{update(`MOVE id=${e.pointerId} x=${Math.round(e.clientX)} y=${Math.round(e.clientY)}`)},true);
  window.addEventListener('pointerup',e=>{update(`UP id=${e.pointerId}`)},true);
  function update(extra){box.textContent=downInfo+(extra?(String.fromCharCode(10)+extra):'')+String.fromCharCode(10)+'TM.ptr.size='+(TM?TM.ptr.size:'-')+' TM.moved='+(TM?TM.moved:'-')+String.fromCharCode(10)+'scrollX='+window.scrollX+' scrollY='+window.scrollY+' docW='+document.documentElement.scrollWidth+' winW='+innerWidth}

(function(){if(!TPP.on)return; // (لا تظهر إلا مع ?perf=1) علامة نسخة واضحة وثابتة بزاوية الشاشة، فقط للتأكد أثناء الاختبار إننا نشوف آخر نسخة منشورة فعلاً (مش نسخة قديمة محفوظة بالمتصفح أو الـCDN) — لا تؤثر على أي منطق آخر في التطبيق

// بعد ظهور الواجهة: نبدأ تنزيل دليل التجار مسبقاً فور اكتمال صورة شاشة البداية (أو بعد 2.5 ثانية كحدّ أقصى)، كي لا ينافسها على اتصال بطيء
// إن تعذّر تحميل صورة شاشة البداية (اتصال متقطّع): نعيد المحاولة مرة واحدة، وإن فشلت نُظهر زرّي «ابدأ الآن» و«تسجيل الدخول» كنصّ واضح بدل أن تبقى الشاشة كحلية بلا أزرار مرئية
(function(){let started=false,tries=0;const go=()=>{if(started)return;started=true;prefetchDirectory()};
  const load=()=>{const im=new Image();im.onload=()=>{const bg=document.getElementById('spbg');if(tries&&bg)bg.style.backgroundImage='url('+SPLASH_IMG+')';go()};
    im.onerror=()=>{if(++tries<2)return setTimeout(load,1500);SPLASH_FAIL=true;const sp=document.getElementById('sp');if(sp)sp.classList.add('noimg');go()};im.src=SPLASH_IMG};
  load();setTimeout(go,2500)})();
// صور التطبيق الثابتة (assets/img): عند فشل التحميل (اتصال متقطّع) نعيد المحاولة مرة واحدة بعد ثانيتين، وإن فشلت نخفي الصورة المكسورة مع إبقاء مساحتها كما هي (لا تغيير بالتخطيط)
document.addEventListener('error',e=>{const im=e.target;if(!im||im.tagName!=='IMG')return;const src=im.getAttribute('src')||'';if(src.indexOf('assets/img/')!==0)return;
  if(!im.dataset.tpRetry){im.dataset.tpRetry='1';setTimeout(()=>{if(im.isConnected)im.src=src.split('?')[0]+'?r=1'},2000);return}
  im.style.visibility='hidden'},true);
(function(){ // ?perf=1 فقط: لوحة قياس مراحل الإقلاع على الجهاز الحقيقي. لا تعرض أي بيانات خاصة (أرقام هواتف/أسماء)، فقط أزمنة بالميلي ثانية وأحجام نقل
  if(!TPP.on)return;
  const L=[['head-parsed','HTML head parsed'],['boot-screen','Navy boot screen in DOM'],['script-start','App script started'],['app-ready','App ready (first render)'],
    ['dir-prefetch-start','Merchant list prefetch start'],['dir-prefetch-end','Merchant list prefetch done'],['login','Login completed'],['dir-start','Directory sync start'],['dir-from-prefetch','Directory reused prefetch'],
    ['shops-data','Shops data available'],['map-init','Map initialised'],['map-merchant-data','Map merchant data available'],['map-ready','Map ready (first tile)'],['first-pins','First pins rendered'],['offers-data','Offers data available']];
  const box=document.createElement('div');box.id='tpPerf';
  box.style.cssText='position:fixed;top:calc(env(safe-area-inset-top) + 4px);left:4px;z-index:100000;max-width:calc(100vw - 8px);background:rgba(0,0,0,.82);color:#9f9;font:10.5px/1.45 ui-monospace,Menlo,monospace;padding:6px 8px;border-radius:8px;direction:ltr;text-align:left;white-space:pre;overflow:auto;max-height:70vh';
  const kb=n=>n?Math.round(n/1024)+'KB':'-';
  function text(){const n=performance.getEntriesByType('navigation')[0]||{},m=TPP.m,lg=m.login;
    let t='TP perf · '+(document.querySelector('meta[name=tp-build]')||{}).content+'\n';
    t+='HTML first byte  '+Math.round(n.responseStart||0)+' ms\nHTML downloaded  '+Math.round(n.responseEnd||0)+' ms ('+kb(n.transferSize)+')\nDOMContentLoaded '+Math.round(n.domContentLoadedEventEnd||0)+' ms\n';
    L.forEach(([k,lab])=>{if(m[k]!=null)t+=(lab+'                                  ').slice(0,32)+String(m[k]).padStart(6)+' ms'+(lg!=null&&m[k]>=lg&&k!=='login'?'  (login+'+(m[k]-lg)+')':'')+'\n'});
    const R=performance.getEntriesByType('resource'),img=R.filter(e=>e.name.indexOf('/assets/img/')>=0),rpc=R.filter(e=>e.name.indexOf('/rest/v1/rpc/')>=0);
    t+='assets/img: '+img.length+' loaded, '+kb(img.reduce((a,e)=>a+(e.transferSize||0),0))+' transferred ('+img.filter(e=>!e.transferSize&&e.decodedBodySize).length+' from cache)\n';
    rpc.forEach(e=>{t+='rpc '+e.name.split('/rpc/')[1].split('?')[0]+': '+Math.round(e.startTime)+'→'+Math.round(e.responseEnd)+' ms '+kb(e.transferSize)+'\n'});
    return t}
  const pre=document.createElement('div');const bar=document.createElement('div');bar.style.cssText='margin-top:4px;display:flex;gap:6px';
  const btn=(l,f)=>{const b=document.createElement('button');b.textContent=l;b.style.cssText='font:11px monospace;padding:2px 8px;border-radius:5px;border:0;background:#ffc20e;color:#000';b.onclick=f;bar.appendChild(b)};
  btn('Copy',()=>{const t=text();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied'),()=>prompt('Copy:',t))});
  btn('Hide',()=>{box.style.display='none'});
  box.appendChild(pre);box.appendChild(bar);
  const add=()=>{if(!box.isConnected)document.body.appendChild(box)};add();
  const tick=()=>{pre.textContent=text()};tick();const iv=setInterval(()=>{add();tick()},500);setTimeout(()=>clearInterval(iv),180000);
})();
